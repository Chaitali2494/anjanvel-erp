name: Build & Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create .env
        working-directory: flutter_app
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Fix pubspec and create assets
        working-directory: flutter_app
        run: |
          # Rewrite pubspec flutter section to remove missing asset/font refs
          python3 - <<'EOF'
import re

with open('pubspec.yaml', 'r') as f:
    content = f.read()

# Replace the entire flutter: section's assets and fonts blocks
flutter_section = """
flutter:
  uses-material-design: true

  assets:
    - .env
"""
content = re.sub(r'\nflutter:.*', flutter_section, content, flags=re.DOTALL)

with open('pubspec.yaml', 'w') as f:
    f.write(content)

print("pubspec.yaml rewritten successfully")
EOF
          cat pubspec.yaml | grep -A 20 "^flutter:"

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code
        working-directory: flutter_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        working-directory: flutter_app
        run: flutter build web --release --base-href=/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: flutter_app/build/web/

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: flutter_app/build/web
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
