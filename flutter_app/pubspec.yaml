name: anjanvel_erp
description: Anjanvel Agro Tourism Resort ERP Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Supabase
  supabase_flutter: ^2.3.4

  # Firebase (Push Notifications)
  firebase_core: ^2.27.1
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0

  # Forms & Validation
  flutter_form_builder: ^9.3.0
  form_builder_validators: ^10.0.1

  # Date/Time
  intl: ^0.19.0
  table_calendar: ^3.1.1

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1

  # Image
  image_picker: ^1.0.7
  image_cropper: ^7.0.3

  # Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Network
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  collection: ^1.18.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  flutter_dotenv: ^5.1.0

  # Excel Export
  excel: ^4.0.2

  # Misc
  permission_handler: ^11.3.1
  flutter_slidable: ^3.1.0
  timeago: ^3.6.1
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

